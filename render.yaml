services:
  # Backend Web Service
  - type: web
    name: arcticfresh-backend
    env: node
    rootDir: server
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3001
      # Note: Set DATABASE_URL and JWT_SECRET manually in the Render Dashboard

  # Frontend Static Site
  - type: web
    name: arcticfresh-frontend
    env: static
    rootDir: client
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /*
        name: Cache-Control
        value: public, max-age=0, must-revalidate
    envVars:
      - key: VITE_API_BASE_URL
        value: https://arcticfresh-backend.onrender.com/api/v1
